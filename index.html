<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clinical Whiteboard</title>
<style>
  :root{
    --bg: #000000;
    --fg: #ffb000;       /* amber - low eye strain, classic clinical monitor */
    --fg-dim: #7a5800;
    --panel-border: #2a2a2a;
    --accent: #ff3b30;
    --bar-bg: #111111;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
  }

  /* ---------- Top control bar ---------- */
  #bar {
    height: 56px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 16px;
    color: #999;
    font-size: 14px;
    transition: opacity 0.3s, height 0.3s;
    z-index: 100;
    position: relative;
  }
  #bar.hidden {
    height: 0;
    padding: 0;
    overflow: hidden;
    opacity: 0;
    border: none;
  }

  #bar .group { display: flex; align-items: center; gap: 6px; }
  #bar label { color: #777; margin-right: 4px; }

  .countBtn {
    background: #1c1c1c;
    color: #ccc;
    border: 1px solid #333;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
  }
  .countBtn.active {
    background: var(--fg);
    color: #000;
    border-color: var(--fg);
  }

  .colorBtn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #444;
    cursor: pointer;
    padding: 0;
  }
  .colorBtn.active { border-color: #fff; }

  #clearAll {
    background: #2a1010;
    color: #ff6b5e;
    border: 1px solid #4a1a1a;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-left: auto;
  }

  #hideHint {
    color: #555;
    font-size: 12px;
  }

  /* ---------- Grid ---------- */
  #grid {
    display: grid;
    width: 100%;
    height: calc(100% - 56px);
    gap: 3px;
    background: var(--panel-border);
    transition: height 0.3s;
  }
  #bar.hidden + #grid { height: 100%; }

  .panel {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 2vh 2vw;
    overflow: hidden;
  }

  .labelRow {
    position: absolute;
    top: 1.2vh;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .labelInput {
    color: var(--fg-dim);
    font-size: clamp(14px, 2.4vw, 32px);
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    text-align: center;
    width: 90%;
    outline: none;
    cursor: text;
  }
  .labelInput:focus { color: var(--fg); }

  .measurement {
    background: transparent;
    border: none;
    color: var(--fg);
    text-align: center;
    font-weight: 700;
    width: 96%;
    max-width: 96%;
    outline: none;
    text-shadow: 0 0 18px rgba(255,176,0,0.35);
    font-variant-numeric: tabular-nums;
    caret-color: var(--accent);
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    white-space: nowrap;
  }
  .measurement::placeholder {
    color: #2a2a2a;
  }

  /* base/max font sizes per layout - actual size is auto-fit by JS to prevent overflow */
  .panels-1 .measurement { font-size: 320px; }
  .panels-2 .measurement { font-size: 220px; }
  .panels-4 .measurement { font-size: 150px; }
  .panels-3 .measurement { font-size: 170px; }

  .timestamp {
    position: absolute;
    bottom: 1vh;
    right: 1.2vw;
    color: #3a3a3a;
    font-size: clamp(10px, 1vw, 16px);
    font-weight: normal;
  }

  /* subtle divider glow off, keep clean */
  ::selection { background: var(--accent); color: #000; }
</style>
</head>
<body>

<div id="bar">
  <div class="group">
    <label>Panels:</label>
    <button class="countBtn" data-n="1">1</button>
    <button class="countBtn" data-n="2">2</button>
    <button class="countBtn" data-n="3">3</button>
    <button class="countBtn active" data-n="4">4</button>
  </div>

  <div class="group">
    <label>Colour:</label>
    <button class="colorBtn active" data-color="#ffb000" style="background:#ffb000"></button>
    <button class="colorBtn" data-color="#00ff66" style="background:#00ff66"></button>
    <button class="colorBtn" data-color="#ffffff" style="background:#ffffff"></button>
    <button class="colorBtn" data-color="#00d9ff" style="background:#00d9ff"></button>
  </div>

  <span id="hideHint">press <b>H</b> to hide this bar / <b>Esc</b> to show it</span>

  <button id="clearAll">Clear All</button>
</div>

<div id="grid" class="panels-4"></div>

<script>
const grid = document.getElementById('grid');
const bar = document.getElementById('bar');
const countBtns = document.querySelectorAll('.countBtn');
const colorBtns = document.querySelectorAll('.colorBtn');
const clearAllBtn = document.getElementById('clearAll');

const STORAGE_KEY = 'clinicalWhiteboardState';
const defaultLabels = ['Right Lobe', 'Left Lobe', 'Isthmus', 'Lower Pole'];
const presetLabels = [
  'Right Lobe', 'Left Lobe', 'Isthmus',
  'Upper Pole', 'Lower Pole', 'Mid Pole',
  'Nodule 1', 'Nodule 2', 'Nodule 3',
  'Lymph Node', 'Right Lymph Node', 'Left Lymph Node',
  'Custom...'
];

const MAX_FONT = { 1: 320, 2: 220, 3: 170, 4: 150 };
const MIN_FONT = 28;

let state = {
  count: 4,
  color: '#ffb000',
  panels: [
    { label: '', value: '' },
    { label: '', value: '' },
    { label: '', value: '' },
    { label: '', value: '' }
  ]
};

function loadState() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY));
    if (saved) state = saved;
  } catch (e) {}
}

function saveState() {
  sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function gridLayout(n) {
  if (n === 1) return { cols: 1, rows: 1, cls: 'panels-1' };
  if (n === 2) return { cols: 2, rows: 1, cls: 'panels-2' };
  if (n === 3) return { cols: 2, rows: 2, cls: 'panels-3' }; // 3 panels, last cell empty/wide
  return { cols: 2, rows: 2, cls: 'panels-4' };
}

function render() {
  const { count } = state;
  const layout = gridLayout(count);

  grid.className = layout.cls;
  grid.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;
  grid.innerHTML = '';

  for (let i = 0; i < count; i++) {
    if (!state.panels[i]) {
      state.panels[i] = { label: '', value: '' };
    }
    const p = state.panels[i];

    const panel = document.createElement('div');
    panel.className = 'panel';
    if (count === 3 && i === 2) {
      panel.style.gridColumn = '1 / span 2';
    }

    const labelRow = document.createElement('div');
    labelRow.className = 'labelRow';

    const labelInput = document.createElement('input');
    labelInput.className = 'labelInput';
    labelInput.type = 'text';
    labelInput.value = p.label;
    labelInput.placeholder = 'Input free text...';
    labelInput.spellcheck = false;
    labelInput.addEventListener('focus', () => labelInput.select());
    labelInput.addEventListener('input', () => { p.label = labelInput.value; saveState(); });

    labelRow.appendChild(labelInput);

    const measurement = document.createElement('input');
    measurement.className = 'measurement';
    measurement.value = p.value;
    measurement.placeholder = 'e.g. 4.2 x 3.5 x 5.4 mm';
    measurement.spellcheck = false;
    measurement.style.color = state.color;
    measurement.addEventListener('focus', () => measurement.select());
    measurement.addEventListener('input', () => {
      p.value = measurement.value;
      saveState();
      autoFit(measurement, state.count);
    });
    measurement.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const next = grid.querySelectorAll('.measurement')[i+1];
        if (next) { next.focus(); next.select(); }
        else measurement.blur();
      }
    });

    panel.appendChild(labelRow);
    panel.appendChild(measurement);
    grid.appendChild(panel);
  }

  // update all measurement text colors and fit text
  document.querySelectorAll('.measurement').forEach(el => {
    el.style.color = state.color;
    autoFit(el, state.count);
  });

  // focus first empty field on load
  const firstEmpty = Array.from(document.querySelectorAll('.measurement')).find(el => !el.value);
  if (firstEmpty) firstEmpty.focus();
}

function autoFit(input, count) {
  const maxSize = MAX_FONT[count] || 150;
  const container = input.parentElement;
  // use the actual rendered width of the panel, with a generous safety margin
  // to account for text-shadow glow, sub-pixel rounding, and font metric variance
  const available = container.clientWidth * 0.82;

  // measure using a hidden canvas for speed
  const canvas = autoFit._canvas || (autoFit._canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');

  let size = maxSize;
  const text = input.value || input.placeholder;

  if (!text) {
    input.style.fontSize = (count === 1 ? maxSize * 0.4 : maxSize * 0.5) + 'px';
    return;
  }

  while (size > MIN_FONT) {
    ctx.font = `700 ${size}px Arial, Helvetica Neue, sans-serif`;
    const width = ctx.measureText(text).width;
    if (width <= available) break;
    size -= 2;
  }

  input.style.fontSize = size + 'px';

  // safety pass: after the browser actually lays out this font size,
  // shrink further if it still overflows (covers any measurement/render mismatch)
  requestAnimationFrame(() => {
    let guard = 20;
    while (input.scrollWidth > input.clientWidth && size > MIN_FONT && guard > 0) {
      size -= 2;
      input.style.fontSize = size + 'px';
      guard--;
    }
  });
}

countBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    countBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.count = parseInt(btn.dataset.n, 10);
    saveState();
    render();
  });
});

colorBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    colorBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.color = btn.dataset.color;
    saveState();
    render();
  });
});

clearAllBtn.addEventListener('click', () => {
  state.panels.forEach(p => { p.value = ''; p.label = ''; });
  saveState();
  render();
});

document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'h' && document.activeElement.tagName !== 'INPUT') {
    bar.classList.toggle('hidden');
    setTimeout(() => document.querySelectorAll('.measurement').forEach(el => autoFit(el, state.count)), 320);
  }
  if (e.key === 'Escape') {
    bar.classList.remove('hidden');
    setTimeout(() => document.querySelectorAll('.measurement').forEach(el => autoFit(el, state.count)), 320);
  }
});

window.addEventListener('resize', () => {
  document.querySelectorAll('.measurement').forEach(el => autoFit(el, state.count));
});

loadState();
// sync active button states to loaded state
countBtns.forEach(b => b.classList.toggle('active', parseInt(b.dataset.n,10) === state.count));
colorBtns.forEach(b => b.classList.toggle('active', b.dataset.color === state.color));
render();
</script>

</body>
</html>
